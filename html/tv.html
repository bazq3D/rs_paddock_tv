<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Paddock TV Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #000000;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .tv-video {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background: #000000;
            pointer-events: none;
        }
        .tv-video iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            border: 0;
            outline: 0;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
            object-fit: cover;
        }
        /* Black overlay to mask the initial 1.4s YouTube title card load flash */
        #black-overlay {
            position: absolute;
            inset: 0;
            background: #000000;
            z-index: 99;
            pointer-events: none;
            transition: opacity 0.5s ease;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="tv-video">
        <iframe id="yt" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin" frameborder="0"></iframe>
    </div>
    <div id="black-overlay"></div>
    <script src="tv.js"></script>
</body>
</html>
