<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Paddock TV Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #000000;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        #player-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }
        #player-wrapper iframe, #player {
            position: absolute;
            top: -14%;
            left: -14%;
            width: 128% !important;
            height: 128% !important;
            border: 0;
            outline: 0;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>
    <div id="player-wrapper">
        <div id="player"></div>
    </div>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="tv.js"></script>
</body>
</html>
