<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS Radio Station Visualizer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="radio-screen">
        <!-- Scanlines Background Overlay -->
        <div class="scanlines"></div>
        <div class="vignette"></div>

        <!-- Radio Player Container -->
        <div class="radio-card">
            <!-- Header Bar -->
            <header class="card-header">
                <div class="header-left">
                    <div class="brand-logo">R</div>
                    <span class="header-pill">PADDOCK RADIO</span>
                </div>
                <div class="header-actions">
                    <span class="status-indicator"></span>
                </div>
            </header>

            <!-- Main Now Playing Banner (Matching rs_radio) -->
            <div class="now-playing-banner">
                <div class="wave-bg-svg">
                    <svg viewBox="0 0 500 150" preserveAspectRatio="none">
                        <path d="M0,80 C150,130 350,30 500,80 L500,150 L0,150 Z" fill="rgba(30, 58, 82, 0.55)"></path>
                        <path d="M0,100 C200,40 300,120 500,90 L500,150 L0,150 Z" fill="rgba(56, 189, 248, 0.15)"></path>
                    </svg>
                </div>

                <div class="banner-content">
                    <div class="song-meta">
                        <span class="now-playing-tag">NOW PLAYING</span>
                        <h2 class="song-title" id="song-title">Anise K - Walking On Air</h2>
                        <span class="song-source">RETRO STORE // 98.4 FM STEREO</span>
                    </div>

                    <div class="player-controls">
                        <button class="ctrl-btn"><i class="fa-solid fa-backward-step"></i></button>
                        <button class="ctrl-btn play-btn" id="btn-toggle-play"><i class="fa-solid fa-pause"></i></button>
                        <button class="ctrl-btn"><i class="fa-solid fa-forward-step"></i></button>
                    </div>
                </div>
            </div>

            <!-- Volume & Mode Control Bar -->
            <div class="mode-vol-bar">
                <div class="mode-pill"><i class="fa-solid fa-radio"></i> RADIO</div>
                <div class="vol-control">
                    <span class="vol-label">Local Volume</span>
                    <div class="vol-track">
                        <div class="vol-fill" style="width: 85%;"></div>
                        <div class="vol-thumb" style="left: 85%;"></div>
                    </div>
                    <span class="vol-val">85%</span>
                </div>
            </div>

            <!-- Saved Playlist Lineup Section -->
            <div class="playlist-section">
                <div class="section-label">SAVED PLAYLIST</div>
                <div class="playlist-selector-row">
                    <div class="dropdown-box">
                        <span>Retro 1 (3)</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                    <div class="action-btn-group">
                        <button class="mini-btn">Save</button>
                        <button class="mini-btn">New</button>
                        <button class="mini-btn">Delete</button>
                    </div>
                </div>

                <!-- Track List -->
                <div class="track-list">
                    <div class="track-item active">
                        <i class="fa-brands fa-youtube icon-yt"></i>
                        <span class="track-name">kyddiekafka - For No One</span>
                        <button class="track-play-btn"><i class="fa-solid fa-play"></i></button>
                    </div>
                    <div class="track-item">
                        <i class="fa-brands fa-youtube icon-yt"></i>
                        <span class="track-name">Anise K - Walking On Air Lyrics...</span>
                        <button class="track-play-btn"><i class="fa-solid fa-play"></i></button>
                    </div>
                    <div class="track-item">
                        <i class="fa-brands fa-soundcloud icon-sc"></i>
                        <span class="track-name">All Around - Retro BGM Mix</span>
                        <button class="track-play-btn"><i class="fa-solid fa-play"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
