<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS Radio Station Visualizer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="radio-screen">
        <!-- CRT & Scanline Overlays -->
        <div class="scanlines"></div>
        <div class="vignette"></div>

        <!-- Fullscreen Ambient Synthwave Scenery Background -->
        <div class="scenery-background">
            <div class="stars"></div>
            <div class="sun"></div>
            <div class="mountains"></div>
            <div class="synth-grid"></div>
        </div>

        <!-- Floating Compact Radio Widget Overlay -->
        <div class="radio-widget pos-top-left" id="radio-widget">
            <!-- Top Header with Official Logo Image -->
            <header class="widget-header">
                <div class="widget-brand">
                    <img src="../logo.webp" class="brand-logo-img" alt="Retro Store Logo">
                </div>
                <div class="widget-icons">
                    <button class="icon-btn"><i class="fa-solid fa-gear"></i></button>
                    <button class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </header>

            <!-- Now Playing Banner -->
            <div class="widget-now-playing">
                <div class="wave-bg">
                    <svg viewBox="0 0 350 70" preserveAspectRatio="none">
                        <path d="M0,45 C90,70 210,15 350,40 L350,70 L0,70 Z" fill="rgba(25, 45, 65, 0.7)"></path>
                        <path d="M0,55 C120,20 240,65 350,50 L350,70 L0,70 Z" fill="rgba(56, 189, 248, 0.25)"></path>
                    </svg>
                </div>

                <div class="np-content">
                    <div class="np-text">
                        <span class="np-label">NOW PLAYING</span>
                        <h3 class="np-title" id="song-title">Kate Bush - Running Up That Hill</h3>
                        <span class="np-station" id="station-name">Rebel Radio South (Rap / Hi-Fi BGM)</span>
                    </div>

                    <div class="np-controls">
                        <button class="ctrl-btn"><i class="fa-solid fa-backward-step"></i></button>
                        <button class="ctrl-btn btn-square" id="btn-toggle-play"><i class="fa-solid fa-square"></i></button>
                        <button class="ctrl-btn"><i class="fa-solid fa-forward-step"></i></button>
                    </div>
                </div>
            </div>

            <!-- Bottom Control Row (Custom Pill + Volume Slider) -->
            <div class="widget-footer-row">
                <div class="custom-pill">
                    <i class="fa-solid fa-music"></i>
                    <span>CUSTOM</span>
                </div>
                <div class="volume-box">
                    <span class="vol-text">Local Volume</span>
                    <div class="vol-track">
                        <div class="vol-fill" style="width: 85%;"></div>
                        <div class="vol-thumb" style="left: 85%;"></div>
                    </div>
                    <span class="vol-num">100%</span>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
